name: Quality gates

# Automated gate for GraphCraft (GitHub-hosted repo — Actions is the
# project's setup). No secrets required: no backend, no telemetry, no
# deploy credentials. Static `dist/` is the only artefact, and it is
# rebuilt here rather than committed.
# The preview smoke is HTTP-level (no browser binary); the real-browser
# matrix is manual and documented in README ("Supported platforms").
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node (pinned, lockfile install)
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install from lockfile (reproducible, no upgrades)
        run: npm ci

      - name: Lint (oxlint, warnings denied)
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Tests (unit + integration, deterministic)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Distribution notice check (licence + generated third-party texts)
        run: npm run notices:check

      - name: Dependency security audit (high and above)
        run: npm audit --audit-level=high

      - name: 'Dependency licence guard (direct deps: MIT/ISC/Apache-2.0)'
        run: node scripts/check-licenses.mjs

      - name: 'Preview smoke (served build: title + worker + manifest + notices)'
        run: |
          npm run preview -- --port 4173 --strictPort &
          PREVIEW_PID=$!
          SMOKE_DIR=$(mktemp -d)
          SMOKE_FILE="$SMOKE_DIR/body"
          trap 'rm -rf "$SMOKE_DIR"; kill $PREVIEW_PID' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/ -o /dev/null 2>&1 && break
            sleep 1
          done
          # Fetch to a file, then match — no `curl | grep -q` pipeline that
          # could flake on SIGPIPE if grep exits after the first match.
          curl -fsS http://localhost:4173/ -o "$SMOKE_FILE"
          grep -q '<title>GraphCraft</title>' "$SMOKE_FILE"
          # Version-proof: assert the served worker carries the version
          # declared in src/offline/version.ts, not a hardcoded string that
          # goes stale when the offline cache version is bumped.
          WORKER_VERSION=$(node -p "require('node:fs').readFileSync('src/offline/version.ts','utf8').match(/OFFLINE_VERSION = '([^']+)'/)[1]")
          curl -fsS http://localhost:4173/sw.js -o "$SMOKE_FILE"
          grep -q "$WORKER_VERSION" "$SMOKE_FILE"
          curl -fsS http://localhost:4173/manifest.webmanifest -o "$SMOKE_FILE"
          grep -q 'GraphCraft' "$SMOKE_FILE"
          # Notice files must be the generated bytes, never the SPA shell.
          # License.txt and the notice bundle must have an unambiguous text
          # MIME; the legacy extensionless /LICENSE keeps working, but Vite
          # preview gives it no Content-Type (the UI links to .txt).
          curl -fsS http://localhost:4173/LICENSE -o "$SMOKE_FILE"
          cmp -s "$SMOKE_FILE" dist/LICENSE
          ! grep -qi '<title>GraphCraft</title>' "$SMOKE_FILE"
          LEGACY_LICENSE_TYPE=$(curl -fsSI http://localhost:4173/LICENSE | tr -d '\r' | awk 'tolower($1)=="content-type:" {print tolower($2)}')
          case "$LEGACY_LICENSE_TYPE" in
            text/html*) echo "preview smoke: /LICENSE served as HTML"; exit 1 ;;
          esac
          curl -fsS http://localhost:4173/LICENSE.txt -o "$SMOKE_DIR/license.txt"
          cmp -s "$SMOKE_DIR/license.txt" dist/LICENSE.txt
          cmp -s dist/LICENSE dist/LICENSE.txt
          ! grep -qi '<title>GraphCraft</title>' "$SMOKE_DIR/license.txt"
          LICENSE_TXT_TYPE=$(curl -fsSI http://localhost:4173/LICENSE.txt | tr -d '\r' | awk 'tolower($1)=="content-type:" {print tolower($2)}')
          case "$LICENSE_TXT_TYPE" in
            text/plain*) ;;
            *) echo "preview smoke: /LICENSE.txt Content-Type is '$LICENSE_TXT_TYPE'"; exit 1 ;;
          esac
          curl -fsS http://localhost:4173/THIRD_PARTY_NOTICES.txt -o "$SMOKE_DIR/notices.txt"
          cmp -s "$SMOKE_DIR/notices.txt" dist/THIRD_PARTY_NOTICES.txt
          ! grep -qi '<title>GraphCraft</title>' "$SMOKE_DIR/notices.txt"
          NOTICES_TYPE=$(curl -fsSI http://localhost:4173/THIRD_PARTY_NOTICES.txt | tr -d '\r' | awk 'tolower($1)=="content-type:" {print tolower($2)}')
          case "$NOTICES_TYPE" in
            text/plain*) ;;
            *) echo "preview smoke: /THIRD_PARTY_NOTICES.txt Content-Type is '$NOTICES_TYPE'"; exit 1 ;;
          esac
          echo "preview smoke: title + worker ($WORKER_VERSION) + manifest + notice files served"

      - name: Gate summary
        if: always()
        run: |
          {
            echo '## Quality gate results'
            echo ''
            echo '- install: `npm ci` (lockfile-pinned, Node 24.20.0)'
            echo '- lint: `npm run lint` (oxlint, warnings denied)'
            echo '- typecheck: `npm run typecheck` (`tsc -b`)'
            echo '- tests: `npm test` (vitest — unit math/sampling/numerics/schemas + integration plotting/projects/data/calculator)'
            echo '- build: `npm run build` (strict type-check + Vite)'
            echo '- notices: `npm run notices:check` (dist LICENSE, LICENSE.txt + deterministic third-party bundle)'
            echo '- audit: `npm audit --audit-level=high`'
            echo '- licences: `node scripts/check-licenses.mjs` (direct deps allowlisted)'
            echo '- smoke: preview serves title, worker (source version), manifest, and exact notice files with text MIME'
            echo ''
            echo 'The job is green only when every step above succeeded; a red step blocks the run.'
          } >> "$GITHUB_STEP_SUMMARY"
